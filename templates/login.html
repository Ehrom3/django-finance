{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-header">
        <div class="eyebrow">С ВОЗВРАЩЕНИЕМ</div>
        <h1>Вход в аккаунт</h1>
        <p>Войдите, чтобы управлять своими финансами</p>
    </div>
    <div class="form-card">
        <form method="post">{% csrf_token %}{% if error %}<div class="alert">{{ error }}</div>{% endif %}<div
                class="form-field"><label for="username">Имя пользователя</label><input id="username" type="text"
                    name="username" autocomplete="username" required></div>
            <div class="form-field"><label for="password">Пароль</label><input id="password" type="password"
                    name="password" autocomplete="current-password" required></div><button
                class="btn btn-primary btn-full" type="submit">Войти →</button>
        </form>
        <p class="auth-bottom">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
