<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои расходы</title>
</head>
<body>

    <h1>Мои расходы</h1>

    <a href="{% url 'expense_create' %}">Добавить расход</a>

    <hr>

    {% for expense in expenses %}

        <h3>Сумма: {{ expense.amount }} сомони</h3>

        <p>Категория: {{ expense.category }}</p>

        <p>Описание: {{ expense.description }}</p>

        <p>Дата: {{ expense.created_at }}</p>

        <a href="{% url 'expense_update' expense.id %}">
            Редактировать
        </a>

        <br><br>

        <a href="{% url 'expense_delete' expense.id %}">
            Удалить
        </a>

        <hr>

    {% empty %}

        <h3>У вас пока нет расходов</h3>

    {% endfor %}

    <br>

    <a href="{% url 'home' %}">На главную</a>

</body>
</html>
