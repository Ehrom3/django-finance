{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-header">
        <div class="eyebrow">НАЧНИТЕ СЕГОДНЯ</div>
        <h1>Создать аккаунт</h1>
        <p>Ваш финансовый порядок начинается здесь</p>
    </div>
    <div class="form-card">
        <form method="post">{% csrf_token %}{% if error %}<div class="alert">{{ error }}</div>{% endif %}<div
                class="form-field"><label for="username">Имя пользователя</label><input id="username" type="text"
                    name="username" autocomplete="username" required></div>
            <div class="form-field"><label for="password">Пароль</label><input id="password" type="password"
                    name="password" autocomplete="new-password" required></div>
            <div class="form-field"><label for="password2">Повторите пароль</label><input id="password2" type="password"
                    name="password2" autocomplete="new-password" required></div><button class="btn btn-primary btn-full"
                type="submit">Создать аккаунт →</button>
        </form>
        <p class="auth-bottom">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div>
</div>
{% endblock %}
