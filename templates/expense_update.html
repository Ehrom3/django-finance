{% extends 'base.html' %}
{% block title %}Редактировать расход{% endblock %}
{% block content %}
<div class="page-heading">
    <div>
        <div class="eyebrow">РАСХОДЫ</div>
        <h1>Редактировать расход</h1>
        <p>Заполните поля ниже и сохраните запись</p>
    </div>
</div>
<div class="form-card">
    <form method="post">{% csrf_token %}<div class="form-field"><label for="amount">Сумма, сомони <span
                    class="required">*</span></label><input id="amount" type="number" name="amount" step="0.01"
                min="0.01" placeholder="Например, 1500.00" value="{{ expense.amount }}" required></div>
        <div class="form-field"><label for="category">Категория <span class="required">*</span></label><input
                id="category" type="text" name="category" placeholder="Например, Продукты"
                value="{{ expense.category }}" required></div>
        <div class="form-field"><label for="description">Описание <span
                    class="optional">(необязательно)</span></label><textarea id="description" name="description"
                rows="4" placeholder="Добавьте комментарий к записи">{{ expense.description }}</textarea></div>
        <div class="form-actions"><button class="btn btn-red" type="submit">✓ Сохранить изменения</button><a
                class="btn btn-outline" href="{% url 'expense_list' %}">Отмена</a></div>
    </form>
</div>
{% endblock %}
